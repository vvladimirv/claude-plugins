# CI: puna traka testova na svaki push i pull request (brza traka ide lokalno kroz pre-commit).
# UPUTA: ostavi samo blok za izabrani stack, obriši ostale i sve "# UPUTA" linije.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # UPUTA: Node / Vite / JS stack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: {{KOMANDA_PUNI_TESTOVI}}

      # UPUTA: Python stack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: {{KOMANDA_PUNI_TESTOVI}}

      # UPUTA: E2E + screenshot testovi (samo ako projekat ima UI)
      # Referentne snimke (baseline) prave se na istom OS-u kao CI (Linux): lokalni Windows fontovi daju druge piksele.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
