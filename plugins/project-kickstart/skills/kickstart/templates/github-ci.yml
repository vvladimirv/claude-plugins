# CI: puna traka testova na svaki push i pull request (brza traka ide lokalno kroz pre-commit).
# UPUTA: ostavi samo blokove za izabrani stack i package manager (po lockfile-u), obriši ostale i sve "# UPUTA" linije.
# UPUTA: {{PM_EXEC}} = "pnpm exec" (pnpm) ili "npx" (npm).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      snimci:
        description: "Napravi Linux referentne snimke ekrana (screenshot baseline)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # UPUTA: Node + pnpm (pnpm-lock.yaml). Verzija pnpm-a dolazi iz "packageManager" u package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: {{KOMANDA_PUNI_TESTOVI}}

      # UPUTA: Node + npm (package-lock.json)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: {{KOMANDA_PUNI_TESTOVI}}

      # UPUTA: Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: {{KOMANDA_PUNI_TESTOVI}}

      # UPUTA: E2E + screenshot testovi (samo ako projekat ima UI).
      # Snimci ekrana zavise od OS-a: Playwright dodaje -win32 / -linux u ime fajla, a lokalni Windows snimci ne važe na Linuxu.
      # Zato CI dok u repou nema *-linux.png snimaka poredi samo ponašanje (--ignore-snapshots).
      # Linux snimci: Actions → CI → Run workflow → "snimci", preuzmi artefakt "linux-snimci", commituj ga i ukloni --ignore-snapshots.
      - run: {{PM_EXEC}} playwright install --with-deps chromium
      - if: ${{ !inputs.snimci }}
        run: {{PM_EXEC}} playwright test --reporter=line --ignore-snapshots
      - if: ${{ inputs.snimci }}
        run: {{PM_EXEC}} playwright test --reporter=line --update-snapshots
      - if: ${{ inputs.snimci }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-snimci
          path: |
            **/*-linux.png
            !node_modules/**
      # Tragovi, snimci i diff slike palih testova (uz --reporter=line folder playwright-report/ ne nastaje).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
