# Iste provjere kao prije commita (CLAUDE.md): npm test i claude plugin validate.
# Cloud sesije uzimaju main sa GitHuba, a računari ga dobiju kroz git pull i setup, pa greška na main stiže svuda.
# Testovi na Windowsu i Linuxu su u plugins.yml; ovdje je Linux i validacija marketplacea.
name: CI

on:
  push:
  pull_request:

jobs:
  provjere:
    name: Testovi i validacija plugina
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Testovi hookova (node:test, bez npm zavisnosti).
      - name: npm test
        run: npm test

      # Claude Code CLI: validate radi bez prijave (provjereno sa praznim HOME).
      - name: Instaliraj Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: claude plugin validate .

      # Testovi panela radni-stol (hooks modul, ne node:test).
      - name: claude plugin test radni-stol
        run: claude plugin test plugins/radni-stol
